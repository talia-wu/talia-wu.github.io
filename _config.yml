# Lia'Log 博客配置文件
# 修改前请备份！

# 网站标题
title: "Lia'Log"

# 网站描述（用于 SEO 和 meta 标签）
description: "产品经理的思考笔记 — vibe coding、产品设计"

# 网站 URL（末尾不要加斜杠）
url: "https://talia-wu.github.io"

# 作者信息
author: Talia Wu
email: coco-dny@coze.email

# 导航栏配置
navigation:
  - title: Posts
    url: /posts/
  - title: About
    url: /about/

# 主题（使用自定义布局）
theme: null

# 插件
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown 配置
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 时区
timezone: Asia/Shanghai

# Sass 配置
sass:
  style: compressed
  sass_dir: assets/css

# 链接格式
permalink: /posts/:year/:month/:day/:title/

# 构建配置
future: true
show_drafts: false
